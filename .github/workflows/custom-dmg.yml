name: custom dmg ci

# Builds the customized (voice + Onion 洋蔥) Squirrel and packages a
# distributable DMG (SPEC §17). Closes the three CI gaps that previously
# required local steps: Onion lexicon bundling, DMG assembly, and signing.
#
# Triggers:
#   - push a version tag X.Y.Z or X.Y.Z.W (e.g. 1.1.7.1) → publishes a draft
#     release for that tag with generated release notes + attached DMG
#   - push to master / pull request → full build + DMG artifact (validation, no release)
#   - manual run (workflow_dispatch) → DMG uploaded as a build artifact; set the
#     publish_release input to also create the tag (version from project.pbxproj,
#     or the version input) and publish a release — GITHUB_TOKEN creates the tag,
#     so no local tag push is needed. Supply the `notes` input for rich release
#     notes (blank = auto commit list); uncheck `draft` to publish live in one
#     step instead of leaving a draft to publish by hand.
#
# Building on every PR / push to master (not just at tag time) catches compile
# breaks — most importantly a new sources/Voice or sources/Settings file that
# wasn't registered in project.pbxproj (SwiftLint alone wouldn't notice) — before
# a release tag is cut (SPEC §CI1). The release-attach step stays tag-only.
#
# Signing (see scripts/setup-signing.sh): if the repo defines the secret
# SIGNING_CERTIFICATE_P12_BASE64 (+ _PASSWORD, optional SIGN_IDENTITY_NAME),
# the stable self-signed identity is imported so users' TCC grants
# (Accessibility / Microphone) survive reinstalls. With no secret it falls
# back to ad-hoc signing — the DMG still installs (install.sh strips the
# quarantine attribute), but each build resets those grants.

on:
  push:
    branches:
      - master
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create tag + publish a release from this run'
        type: boolean
        default: false
      version:
        description: 'Version / tag to release (blank = read from project.pbxproj)'
        type: string
        default: ''
      notes:
        description: 'Release notes (Markdown; blank = auto commit list)'
        type: string
        default: ''
      draft:
        description: 'Keep as draft (uncheck to publish live)'
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write   # required for the release-attach step to create/update a release
    env:
      # Match action-build.sh: universal binary + bundled octagram grammar.
      ARCHS: 'arm64 x86_64'
      BUILD_UNIVERSAL: '1'
      SQUIRREL_BUNDLED_RECIPES: 'lotem/rime-octagram-data lotem/rime-octagram-data@hant'
    steps:
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Checkout Squirrel
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      # Quality gates folded in from the retired commit-ci/release-ci workflows.
      # SwiftLint runs first so style failures stop before the heavy clone/build.
      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint

      # data/onion is committed (a tested Onion lexicon snapshot) for
      # reproducible builds — no longer regenerated from Onion_Rime_Files HEAD,
      # which had drifted and shipped broken schema data (SPEC §13.6).
      - name: Install build deps (librime, Sparkle, plum recipes)
        run: ./action-install.sh

      - name: Set up code signing
        env:
          CERT_B64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          CERT_PWD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY_NAME: ${{ secrets.SIGN_IDENTITY_NAME }}
        run: |
          if [ -n "$CERT_B64" ]; then
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            KPWD="$(openssl rand -hex 20)"
            CERT_PATH="$RUNNER_TEMP/identity.p12"
            echo "$CERT_B64" | base64 --decode > "$CERT_PATH"
            security create-keychain -p "$KPWD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KPWD" "$KEYCHAIN"
            security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_PWD" \
              -T /usr/bin/codesign -T /usr/bin/security
            # Allow codesign to use the private key without an interactive prompt.
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPWD" "$KEYCHAIN" >/dev/null
            # Put our keychain first in the search list so codesign finds the identity.
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
            rm -f "$CERT_PATH"
            echo "SIGN_IDENTITY=${SIGN_IDENTITY_NAME:-Squirrel Dev Signing}" >> "$GITHUB_ENV"
            echo "Using imported stable signing identity."
          else
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            echo "No signing secret found — falling back to ad-hoc signing."
          fi

      - name: Build Squirrel (Release)
        run: make release SIGN_IDENTITY="$SIGN_IDENTITY"

      # Dead-code check (from the retired workflows). Advisory: reported in the
      # log but does not block packaging — flip continue-on-error to false to gate.
      - name: Install periphery
        run: brew install peripheryapp/periphery/periphery

      - name: Check Unused Code
        continue-on-error: true
        run: periphery scan --relative-results --skip-build --index-store-path build/Index.noindex/DataStore

      - name: Determine version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            v="$INPUT_VERSION"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Blank input → read the app version straight from project.pbxproj.
            v="$(xcrun agvtool what-version -terse)"
          else
            v="$(git describe --always)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Assemble DMG
        run: scripts/make-dmg.sh "package/Squirrel-custom-${{ steps.ver.outputs.version }}.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: Squirrel-custom-${{ steps.ver.outputs.version }}
          path: package/*.dmg
          retention-days: 90

      # Release notes: commit list since the previous tag (same format as the
      # retired release-ci). Self-contained — no git-cliff install needed in CI.
      # Two paths:
      #   - tag push: action-changelog.sh (current tag = HEAD, prev = tag before)
      #   - manual dispatch: no tag at HEAD yet, so list <last tag>..HEAD directly
      - name: Generate release notes
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') }}
        env:
          INPUT_NOTES: ${{ github.event.inputs.notes }}
        run: |
          if [ -n "$INPUT_NOTES" ]; then
            # Maintainer supplied rich notes at dispatch time — use them verbatim.
            printf '%s\n' "$INPUT_NOTES" > "$RUNNER_TEMP/release-notes.md"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ./action-changelog.sh > "$RUNNER_TEMP/release-notes.md"
          else
            prev="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            echo "**Change log since ${prev:-the beginning}:**" > "$RUNNER_TEMP/release-notes.md"
            echo >> "$RUNNER_TEMP/release-notes.md"
            git log --oneline --decorate "${prev:+$prev..}HEAD" --pretty='format:- %h %s' \
              | grep -v Merge >> "$RUNNER_TEMP/release-notes.md" || true
          fi

      # Publishes the release. On manual dispatch ncipollo creates the tag
      # (pointing at this run's commit) via GITHUB_TOKEN — no local tag push, and
      # no cross-workflow trigger needed since the release happens in this job.
      # Draft by default (safe); dispatch with the `draft` input unchecked to
      # publish live in one step. `notes` input (above) supplies rich release
      # notes without a follow-up manual edit.
      - name: Publish release (tag + notes + DMG)
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') }}
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          commit: ${{ github.sha }}
          bodyFile: ${{ runner.temp }}/release-notes.md
          artifacts: "package/*.dmg"
          draft: ${{ github.event.inputs.draft != 'false' }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
